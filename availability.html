<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Availability</title><link rel="stylesheet" href="assets/styles.css"><style>body{background:#f3f5f9}.wrap{max-width:1000px;margin:35px auto;padding:0 16px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.head h1{margin:0}.legend{color:var(--muted);font-size:11px}.calendar-cell.busy{background:#fff9f1}.availability-dot{margin-top:10px;padding:5px 7px;border-radius:7px;background:#fff0dc;color:#9c6100;font-size:9px;font-weight:800}</style></head><body><div class="wrap"><div class="head"><div><div class="eyebrow">LIVE DATE SHEET</div><h1 id="title">Availability</h1></div><div><button id="prev" class="soft-btn">←</button> <button id="next" class="soft-btn">→</button></div></div><div class="legend">Dates shown as booked may be unavailable. Contact us to confirm.</div><div id="calendar" class="calendar-grid" style="margin-top:12px"></div></div><script>
const $=s=>document.querySelector(s),LS='eventflow_crm_v1';let cursor=new Date(),items=[],settings={};function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}async function load(){let loaded=false;if(location.protocol!=='file:'){try{const from=new Date(cursor.getFullYear(),cursor.getMonth(),1),to=new Date(cursor.getFullYear(),cursor.getMonth()+1,0);const r=await fetch('/api/public/availability?from='+ds(from)+'&to='+ds(to));if(r.ok){const o=await r.json();items=o.items;settings=o.settings;loaded=true}}catch{}}if(!loaded){let d;try{d=JSON.parse(localStorage.getItem(LS))}catch{};if(!d){try{const r=await fetch('data/db.json');if(r.ok)d=await r.json()}catch{}}if(d){settings=d.settings;items=(d.bookings||[]).filter(x=>x.status!=='Cancelled').map(x=>({date:x.eventDate,status:x.status,title:'Booked'}))}}document.documentElement.style.setProperty('--accent',settings.accent||'#6d5dfc');$('#title').textContent=(settings.businessName||'Our')+' availability';render()}function render(){const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),cells=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const busy=items.some(x=>x.date===ds(d));cells.push('<div class="calendar-cell '+(d.getMonth()!==m?'outside ':'')+(busy?'busy':'')+'"><div class="calendar-date">'+d.getDate()+'</div>'+(busy?'<div class="availability-dot">Booked / held</div>':'')+'</div>')}$('#calendar').innerHTML=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>'<div class="calendar-dayname">'+x+'</div>').join('')+cells.join('')}$('#prev').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);load()};$('#next').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);load()};load();
</script></body></html>
