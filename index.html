<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#6d5dfc" />
  <title>EventFlow CRM</title>

  <style id="booking-layout-v17">
    .booking-form{display:block!important;width:100%!important}
    .booking-form .booking-section{display:block!important;width:100%!important;margin:0 0 42px!important;padding:0 0 34px!important;border-top:0!important;border-bottom:1px solid var(--line)!important}
    .booking-form .booking-section:last-child{margin-bottom:0!important;border-bottom:0!important}
    .booking-form .booking-section-heading{display:block!important;width:100%!important;margin:0 0 22px!important;padding:0!important}
    .booking-form .booking-section-fields{display:flex!important;flex-direction:column!important;width:100%!important;gap:18px!important}
    .booking-form .booking-section-fields>.field{display:block!important;width:100%!important;max-width:none!important;grid-column:auto!important}
    .booking-form .booking-section-fields>.field>label:not(.toggle){display:block!important;margin:0 0 7px!important}
    .booking-form .booking-section-fields input,.booking-form .booking-section-fields select,.booking-form .booking-section-fields textarea{display:block!important;width:100%!important}
  </style>
  <link rel="stylesheet" href="assets/styles-v1.7.css" />
</head>
<body>
  <div id="appShell" class="app-shell">
    <aside class="sidebar">
      <div class="brand-wrap">
        <div id="brandMark" class="brand-mark">EF</div>
        <div class="brand-copy">
          <strong id="brandName">EventFlow</strong>
          <span>Booking CRM</span>
        </div>
      </div>

      <nav id="nav" class="nav">
        <button data-route="dashboard" class="active"><span>⌂</span> Dashboard</button>
        <button data-route="enquiries"><span>✦</span> Enquiries <em id="navEnquiryCount"></em></button>
        <button data-route="bookings"><span>▣</span> Bookings</button>
        <button data-route="calendar"><span>□</span> Calendar</button>
        <button data-route="customers"><span>♙</span> Customers</button>
        <button data-route="invoices"><span>£</span> Invoices</button>
        <button data-route="payments"><span>✓</span> Payments</button>
        <div class="nav-divider">BUSINESS</div>
        <button data-route="services"><span>◇</span> Services</button>
        <button data-route="performers"><span>♧</span> Team / Suppliers</button>
        <button data-route="emails"><span>✉</span> Emails & automation</button>
        <button data-route="reports"><span>⌁</span> Reports</button>
        <button data-route="settings"><span>⚙</span> Settings</button>
      </nav>

      <div class="sidebar-bottom">
        <a href="enquiry.html" target="_blank">↗ Public enquiry form</a>
        <a href="availability.html" target="_blank">↗ Availability page</a>
        <div id="modeBadge" class="mode-badge">Checking mode…</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="mobileMenu" class="icon-btn mobile-only" aria-label="Open menu">☰</button>
        <div>
          <div class="eyebrow" id="pageEyebrow">OVERVIEW</div>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="top-actions">
          <button id="globalSearchBtn" class="soft-btn">⌕ Search</button>
          <button id="quickAddBtn" class="primary-btn">＋ New booking</button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-frame" onsubmit="return false">
      <div class="modal-head">
        <div>
          <div id="modalEyebrow" class="eyebrow">CREATE</div>
          <h2 id="modalTitle">New record</h2>
        </div>
        <button id="modalClose" class="icon-btn" type="button">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalFooter" class="modal-footer"></div>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>
  <!-- Address autocomplete: pinned Ideal Postcodes Address Finder browser bundle -->
  <script src="https://cdn.jsdelivr.net/npm/@ideal-postcodes/address-finder-bundled@5"></script>
  <script src="assets/app-v1.7.js"></script>
</body>
</html>
