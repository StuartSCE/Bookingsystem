<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking portal</title><link rel="stylesheet" href="assets/styles.css"><style>body{background:#f3f5f9}.portal{max-width:850px;margin:35px auto;padding:0 16px}.portal-card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:28px}.portal-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.portal-logo{max-width:140px;max-height:70px;object-fit:contain}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}.detail{padding:14px;border:1px solid var(--line);border-radius:12px}.detail span{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.contract{margin-top:20px;padding:18px;background:#fafbfc;border:1px solid var(--line);border-radius:12px;white-space:pre-line}.invoice-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}@media(max-width:600px){.portal{margin:10px auto}.portal-card{padding:20px}.detail-grid{grid-template-columns:1fr}}</style></head><body><div class="portal"><div id="content" class="portal-card">Loading booking…</div></div><script>
const $=s=>document.querySelector(s),LS='eventflow_crm_v1',id=new URLSearchParams(location.search).get('booking');let mode='local',payload=null;const money=(n,c='GBP')=>new Intl.NumberFormat('en-GB',{style:'currency',currency:c}).format(Number(n||0));const date=v=>v?new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'long',year:'numeric'}).format(new Date(v+'T12:00:00')):'—';async function init(){if(!id){$('#content').innerHTML='<b>No booking reference supplied.</b>';return}if(location.protocol!=='file:'){try{const r=await fetch('/api/public/booking/'+encodeURIComponent(id));if(r.ok){payload=await r.json();mode='api'}}catch{}}if(!payload){let d;try{d=JSON.parse(localStorage.getItem(LS))}catch{};if(!d){try{const r=await fetch('data/db.json');if(r.ok)d=await r.json()}catch{}}if(d){const b=(d.bookings||[]).find(x=>x.id===id);if(b)payload={settings:d.settings,booking:b,customer:(d.customers||[]).find(x=>x.id===b.customerId),invoices:(d.invoices||[]).filter(x=>x.bookingId===b.id)}}}if(!payload){$('#content').innerHTML='<b>Booking not found.</b>';return}render()}
function render(){const {settings:s={},booking:b,customer:c={},invoices=[]}=payload;document.documentElement.style.setProperty('--accent',s.accent||'#6d5dfc');$('#content').innerHTML='<div class="portal-top"><div>'+(s.logoUrl?'<img class="portal-logo" src="'+s.logoUrl+'">':'<h2 style="margin:0">'+(s.businessName||'Your Event Business')+'</h2>')+'</div><span class="badge '+(b.status==='Confirmed'?'success':'warning')+'">'+b.status+'</span></div><h1 style="margin:24px 0 4px">'+b.title+'</h1><div class="cell-sub">Booking for '+(c.name||b.customerName)+'</div><div class="detail-grid"><div class="detail"><span>EVENT DATE</span><b>'+date(b.eventDate)+'</b></div><div class="detail"><span>TIME</span><b>'+(b.startTime||'TBC')+(b.endTime?' – '+b.endTime:'')+'</b></div><div class="detail"><span>VENUE</span><b>'+(b.venue||'TBC')+'</b></div><div class="detail"><span>SERVICE</span><b>'+(b.serviceName||'—')+'</b></div><div class="detail"><span>TOTAL</span><b>'+money(b.total,s.currency||'GBP')+'</b></div><div class="detail"><span>CONTRACT</span><b>'+b.contractStatus+'</b></div></div><div class="contract"><b>Booking terms</b><br><br>'+(s.terms||'Please review and accept the booking terms.')+'</div>'+(b.contractStatus!=='Accepted'?'<div style="margin-top:16px"><label class="toggle"><input id="agree" type="checkbox"> I agree to the booking terms above.</label><br><button id="confirm" class="primary-btn" style="margin-top:12px">Accept & confirm booking</button></div>':'<div class="success-box" style="margin-top:16px;padding:14px;background:#eaf8f3;color:#138a60;border-radius:10px"><b>Booking confirmed.</b> Thank you.</div>')+(invoices.length?'<h3 style="margin-top:26px">Invoices</h3>'+invoices.map(i=>'<div class="invoice-row"><div><b>'+i.number+'</b><div class="cell-sub">'+i.type+' · due '+date(i.dueDate)+'</div></div><div style="text-align:right"><b>'+money(i.amount,s.currency||'GBP')+'</b><div>'+i.status+'</div>'+(mode==='api'&&i.status!=='Paid'?'<button class="outline-btn pay-btn" data-invoice="'+i.id+'" style="margin-top:6px">Pay online</button>':'')+'</div></div>').join(''):'');document.querySelectorAll('.pay-btn').forEach(btn=>btn.onclick=()=>payInvoice(btn.dataset.invoice));if($('#confirm'))$('#confirm').onclick=confirmBooking}
async function payInvoice(invoiceId){const r=await fetch('/api/public/invoices/'+encodeURIComponent(invoiceId)+'/checkout',{method:'POST'});const o=await r.json();if(!r.ok)return alert(o.error||'Could not start payment');location.href=o.url}
async function confirmBooking(){if(!$('#agree').checked)return alert('Please tick the box to accept the terms.');if(mode==='api'){const r=await fetch('/api/public/booking/'+encodeURIComponent(id)+'/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:payload.customer?.name||payload.booking.customerName})});if(!r.ok)return alert('Could not confirm booking');payload.booking=(await r.json()).booking}else{const d=JSON.parse(localStorage.getItem(LS));const b=(d.bookings||[]).find(x=>x.id===id);b.status='Confirmed';b.contractStatus='Accepted';b.contractAcceptedAt=new Date().toISOString();localStorage.setItem(LS,JSON.stringify(d));payload.booking=b}render()};init();
</script></body></html>
