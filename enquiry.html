<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Enquire</title><link rel="stylesheet" href="assets/styles.css">
  <style>
    body{background:#f3f5f9}.public-wrap{max-width:760px;margin:42px auto;padding:0 16px}.public-card{background:white;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.public-head{padding:28px 30px;background:#121827;color:white}.public-head h1{margin:12px 0 5px;font-size:29px}.public-head p{margin:0;color:#aeb8ca}.public-logo{max-width:150px;max-height:70px;object-fit:contain;background:white;border-radius:10px;padding:5px}.public-body{padding:26px 30px}.success-box{padding:22px;border-radius:14px;background:#eaf8f3;color:#126b4d;text-align:center}.public-foot{text-align:center;color:var(--muted);font-size:10px;margin:15px}
    @media(max-width:600px){.public-wrap{margin:12px auto}.public-head,.public-body{padding:20px}.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="public-wrap"><div class="public-card"><div class="public-head"><div id="logo"></div><h1 id="businessName">Event enquiry</h1><p>Tell us about your event and we’ll come back to you.</p></div><div class="public-body" id="content"><form id="form"><div class="form-grid"><div class="field"><label>YOUR NAME *</label><input id="name" required></div><div class="field"><label>EMAIL *</label><input id="email" type="email" required></div><div class="field"><label>PHONE</label><input id="phone"></div><div class="field"><label>EVENT DATE</label><input id="eventDate" type="date"></div><div class="field"><label>EVENT TYPE</label><input id="eventType" placeholder="Wedding, birthday, corporate…"></div><div class="field"><label>SERVICE</label><select id="service"><option value="">Choose a service…</option></select></div><div class="field full"><label>VENUE / LOCATION</label><input id="venue"></div><div class="field"><label>APPROX BUDGET</label><input id="budget" type="number" step="0.01"></div><div class="field"><label>HOW DID YOU FIND US?</label><select id="source"><option>Website</option><option>Google</option><option>Instagram</option><option>Facebook</option><option>Referral</option><option>Other</option></select></div><div class="field full"><label>ANYTHING ELSE?</label><textarea id="notes"></textarea></div><div class="field full"><button class="primary-btn" style="width:100%;padding:13px" type="submit">Send enquiry</button></div></div></form></div></div><div class="public-foot">Powered by your own EventFlow CRM</div></div>
<script>
const LS='eventflow_crm_v1';let mode='local',data={settings:{businessName:'Your Event Business',accent:'#6d5dfc'},services:[]};const $=s=>document.querySelector(s);const uid=p=>p+'_'+Math.random().toString(36).slice(2)+Date.now().toString(36);async function init(){if(location.protocol!=='file:'){try{const r=await fetch('/api/public/bootstrap-lite');if(r.ok){data=await r.json();mode='api'}}catch{}if(mode==='local'){try{const r=await fetch('data/db.json');if(r.ok){const d=await r.json();data={settings:d.settings,services:d.services}}}catch{}}}const saved=localStorage.getItem(LS);if(mode==='local'&&saved){try{const d=JSON.parse(saved);data={settings:d.settings,services:d.services}}catch{}}const s=data.settings||{};document.documentElement.style.setProperty('--accent',s.accent||'#6d5dfc');$('#businessName').textContent=s.businessName||'Event enquiry';if(s.logoUrl)$('#logo').innerHTML='<img class="public-logo" src="'+s.logoUrl+'">';(data.services||[]).filter(x=>x.active!==false).forEach(x=>$('#service').insertAdjacentHTML('beforeend','<option>'+x.name+'</option>'));}
$('#form').onsubmit=async e=>{e.preventDefault();const item={name:$('#name').value,email:$('#email').value,phone:$('#phone').value,eventDate:$('#eventDate').value,eventType:$('#eventType').value,service:$('#service').value,venue:$('#venue').value,budget:Number($('#budget').value||0),source:$('#source').value,notes:$('#notes').value};if(mode==='api'){const r=await fetch('/api/public/enquiry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item)});const out=await r.json();if(!r.ok)return alert(out.error||'Could not send enquiry');$('#content').innerHTML='<div class="success-box"><b>Enquiry received</b><br><br>'+(out.message||'Thanks — we will be in touch shortly.')+'</div>'}else{let d;try{d=JSON.parse(localStorage.getItem(LS))}catch{};d=d||{settings:data.settings,enquiries:[],customers:[],bookings:[],invoices:[],payments:[],services:data.services,performers:[],emailTemplates:[],automations:[],documents:[],activities:[]};d.enquiries=d.enquiries||[];d.enquiries.unshift({id:uid('enq'),createdAt:new Date().toISOString(),status:'New',...item});d.activities=d.activities||[];d.activities.unshift({id:uid('act'),createdAt:new Date().toISOString(),type:'enquiry',text:'New web enquiry from '+item.name});localStorage.setItem(LS,JSON.stringify(d));$('#content').innerHTML='<div class="success-box"><b>Enquiry received</b><br><br>'+((d.settings||{}).enquiryThankYou||'Thanks — we will be in touch shortly.')+'</div>'}};init();
</script></body></html>
